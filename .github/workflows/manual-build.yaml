# Copyright Contributors to the KubeOpenCode project
name: Manual Build

on:
  workflow_dispatch:
    inputs:
      build_kubeopencode:
        description: 'Build and push kubeopencode image'
        type: boolean
        default: true
      build_helm:
        description: 'Build and push Helm chart'
        type: boolean
        default: true
      build_agent_opencode:
        description: 'Build and push agent-opencode image'
        type: boolean
        default: false
      build_agent_devbox:
        description: 'Build and push agent-devbox image'
        type: boolean
        default: false
      build_agent_attach:
        description: 'Build and push agent-attach image'
        type: boolean
        default: false

env:
  GO_VERSION: "1.26"
  IMG_REGISTRY: ghcr.io
  IMG_ORG: kubeopencode
  IMG_NAME: kubeopencode

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      org: ${{ steps.org.outputs.org }}
    steps:
      - name: Set image organization
        id: org
        run: echo "org=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-kubeopencode:
    name: Build KubeOpenCode
    runs-on: ubuntu-latest
    needs: [prepare]
    if: ${{ inputs.build_kubeopencode }}
    env:
      IMG_ORG: ${{ needs.prepare.outputs.org }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "ui/pnpm-lock.yaml"

      - name: Build UI
        run: |
          cd ui && pnpm install --frozen-lockfile && pnpm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push kubeopencode
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
          tags: |
            ${{ env.IMG_REGISTRY }}/${{ env.IMG_ORG }}/${{ env.IMG_NAME }}:latest
            ${{ env.IMG_REGISTRY }}/${{ env.IMG_ORG }}/${{ env.IMG_NAME }}:${{ github.sha }}

  push-helm-chart:
    name: Push Helm Chart
    runs-on: ubuntu-latest
    needs: [prepare]
    if: ${{ inputs.build_helm }}
    env:
      IMG_ORG: ${{ needs.prepare.outputs.org }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Login to Helm registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push Helm chart
        run: |
          mkdir -p dist
          helm package charts/kubeopencode -d dist/
          helm push dist/kubeopencode-*.tgz oci://ghcr.io/${{ env.IMG_ORG }}/helm-charts

  build-agent-opencode:
    name: Build Agent OpenCode
    runs-on: ubuntu-latest
    needs: [prepare]
    if: ${{ inputs.build_agent_opencode }}
    env:
      IMG_ORG: ${{ needs.prepare.outputs.org }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OPENCODE_VERSION from agents/Makefile
        id: opencode-version
        run: echo "version=$(grep '^OPENCODE_VERSION' agents/Makefile | head -1 | sed 's/.*?= *//')" >> "$GITHUB_OUTPUT"

      - name: Build and push opencode agent
        uses: docker/build-push-action@v7
        with:
          context: ./agents/opencode
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENCODE_VERSION=${{ steps.opencode-version.outputs.version }}
          tags: |
            ${{ env.IMG_REGISTRY }}/${{ env.IMG_ORG }}/kubeopencode-agent-opencode:latest
            ${{ env.IMG_REGISTRY }}/${{ env.IMG_ORG }}/kubeopencode-agent-opencode:${{ github.sha }}

  build-agent-devbox:
    name: Build Agent Devbox
    runs-on: ubuntu-latest
    needs: [prepare]
    if: ${{ inputs.build_agent_devbox }}
    env:
      IMG_ORG: ${{ needs.prepare.outputs.org }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devbox agent
        uses: docker/build-push-action@v7
        with:
          context: ./agents/devbox
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMG_REGISTRY }}/${{ env.IMG_ORG }}/kubeopencode-agent-devbox:latest
            ${{ env.IMG_REGISTRY }}/${{ env.IMG_ORG }}/kubeopencode-agent-devbox:${{ github.sha }}

  build-agent-attach:
    name: Build Agent Attach
    runs-on: ubuntu-latest
    needs: [prepare]
    if: ${{ inputs.build_agent_attach }}
    env:
      IMG_ORG: ${{ needs.prepare.outputs.org }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push attach agent
        uses: docker/build-push-action@v7
        with:
          context: ./agents/attach
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMG_REGISTRY }}/${{ env.IMG_ORG }}/kubeopencode-agent-attach:latest
            ${{ env.IMG_REGISTRY }}/${{ env.IMG_ORG }}/kubeopencode-agent-attach:${{ github.sha }}
